name: Pull-request pre-release builder
on:
  pull_request:
    types: [labeled, unlabeled, synchronize, opened, reopened, edited]
    branches: [ 'main' ]
jobs:

  build:
    permissions: write-all
    runs-on: ubuntu-latest
    if: contains(join(github.event.pull_request.labels.*.name, ','), 'pre-release')
    strategy:
      matrix:
        go-version: [ '1.24.0' ]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Get next version
        id: nextversion
        uses: technote-space/get-next-version-action@v1
      - name: Cleanup the next version number
        id: nextversion-clean
        run: echo "next=${INVAR//v/}" >> "$GITHUB_OUTPUT"
        env:
          INVAR: ${{ steps.nextversion.outputs.next }}


      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Setup Ko
        uses: ko-build/setup-ko@v0.9
      - name: Set up Kubeconform
        uses: bmuschko/setup-kubeconform@v1
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Image
        env:
          IMAGE_REGISTRY_NAMESPACE: angeloxx
          IMAGE_REGISTRY: docker.io
          IMAGE_TAG_FORCED: ${{ steps.nextversion-clean.outputs.next }}-next-${{ github.event.pull_request.head.sha }}
        run: |
          make build-image

      - name: Build Helm Chart
        env:
          IMAGE_REGISTRY_NAMESPACE: angeloxx
          IMAGE_REGISTRY: docker.io
          IMAGE_TAG_FORCED: ${{ steps.nextversion-clean.outputs.next }}-next-${{ github.event.pull_request.head.sha }}
          HELM_TAG_FORCED: ${{ steps.nextversion-clean.outputs.next }}-next-${{ github.event.pull_request.head.sha }}-helm
        run: |
          make helm
          make build-helm-upload
      - name: update the PR
        uses: KeisukeYamashita/create-comment@v1
        with:
          comment: |
            👋 pre-release built with success, image tag is latest, helm tag is ${{ steps.nextversion-clean.outputs.next }}-next-${{ github.event.pull_request.head.sha }}-helm
