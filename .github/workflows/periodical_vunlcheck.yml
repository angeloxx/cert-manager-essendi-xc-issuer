name: Vulnerability check
on:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  vuln-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Golang Vulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-file: go.mod
          check-latest: false