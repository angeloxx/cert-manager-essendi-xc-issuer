{{- if .Values.rbac.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-manager-essendi-xc-issuer.fullname" . }}-manager-role
  labels:
    {{- include "cert-manager-essendi-xc-issuer.labels" . | nindent 4 }}
rules:
  - apiGroups: [ "" ]
    resources: [ "events" ]
    verbs: [ "create", "patch" ]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get","list","watch"]
  - apiGroups: ["essendixc.angeloxx.ch"]
    resources: ["issuers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["essendixc.angeloxx.ch"]
    resources: ["issuers/status"]
    verbs: ["get", "patch","update"]
  - apiGroups: ["essendixc.angeloxx.ch"]
    resources: ["clusterissuers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["essendixc.angeloxx.ch"]
    resources: ["clusterissuers/status"]
    verbs: ["get", "patch","update"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["get", "list", "watch", "update","patch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests/status","certificaterequests/finalizers","certificates/finalizers"]
    verbs: ["get", "update","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-essendi-xc-issuer.fullname" . }}-manager-rolebinding
  labels:
    {{- include "cert-manager-essendi-xc-issuer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cert-manager-essendi-xc-issuer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "cert-manager-essendi-xc-issuer.fullname" . }}-manager-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}