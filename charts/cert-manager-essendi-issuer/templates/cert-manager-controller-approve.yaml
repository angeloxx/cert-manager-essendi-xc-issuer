{{- if .Values.rbac.enabled  }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-manager-essendi-issuer.fullname" . }}-cert-manager-controller-approve
  labels:
    {{- include "cert-manager-essendi-issuer.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - cert-manager.io
    resourceNames:
      - issuers.essendixc.angeloxx.ch/*
      - clusterissuers.essendixc.angeloxx.ch/*
    resources:
      - signers
    verbs:
      - approve
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-essendi-issuer.fullname" . }}-cert-manager-controller-approve
  labels:
    {{- include "cert-manager-essendi-issuer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-manager-essendi-issuer.fullname" . }}-cert-manager-controller-approve
subjects:
  - kind: ServiceAccount
    name: {{ include "cert-manager-essendi-issuer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
  - kind: ServiceAccount
    name: {{ .Values.rbac.certManagerServiceAccountName }}
    namespace: {{ .Values.rbac.certManagerNamespace }}
{{- end  }}