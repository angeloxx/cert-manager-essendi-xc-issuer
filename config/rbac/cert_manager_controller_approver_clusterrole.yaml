# permissions to approve all essendixc.angeloxx.ch requests
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-controller-approve:sample-issuer-example-com
rules:
- apiGroups:
  - cert-manager.io
  resources:
  - signers
  verbs:
  - approve
  resourceNames:
  - issuers.essendixc.angeloxx.ch/*
  - clusterissuers.essendixc.angeloxx.ch/*
